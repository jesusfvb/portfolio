<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Jesús Francisco Vázquez Biltre</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        background: #121212;
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem;
      }
      
      .container {
        max-width: 600px;
      }
      
      h1 {
        font-size: 8rem;
        font-weight: bold;
        background: linear-gradient(to right, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
      
      h2 {
        font-size: 2rem;
        font-weight: 600;
        color: white;
        margin-bottom: 1rem;
      }
      
      p {
        font-size: 1.125rem;
        color: #d0d0d0;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      
      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: white;
        background: linear-gradient(to right, #6366f1, #8b5cf6);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      }
      
      .btn:active {
        transform: translateY(0);
      }
      
      @media (max-width: 768px) {
        h1 {
          font-size: 5rem;
        }
        
        h2 {
          font-size: 1.5rem;
        }
        
        p {
          font-size: 1rem;
        }
      }
    </style>
    <script>
      // Translations for 404 page
      const translations = {
        en: {
          title: '404 - Page Not Found | Jesús Francisco Vázquez Biltre',
          heading: 'Page Not Found',
          message: "We're sorry, the page you're looking for doesn't exist or has been moved.",
          button: 'Back to Home'
        },
        es: {
          title: '404 - Página no encontrada | Jesús Francisco Vázquez Biltre',
          heading: 'Página no encontrada',
          message: 'Lo sentimos, la página que buscas no existe o ha sido movida.',
          button: 'Volver al inicio'
        }
      };

      // Detect language: localStorage (user preference) > navigator.language > 'en' (default)
      function getLanguage() {
        // Check localStorage for saved preference
        const stored = localStorage.getItem('portfolio:language');
        if (stored && (stored === 'en' || stored === 'es')) {
          return stored;
        }
        
        // Check navigator language
        const navLang = navigator.language.toLowerCase();
        if (navLang.startsWith('es')) {
          return 'es';
        }
        
        // Default to English
        return 'en';
      }

      // Set language on load
      window.addEventListener('DOMContentLoaded', function() {
        const lang = getLanguage();
        const t = translations[lang];
        
        // Update page title
        document.title = t.title;
        
        // Update HTML lang attribute
        document.documentElement.lang = lang;
        
        // Update content
        const heading = document.querySelector('h2');
        const message = document.querySelector('p');
        const button = document.querySelector('a.btn');
        
        if (heading) heading.textContent = t.heading;
        if (message) message.textContent = t.message;
        if (button) button.textContent = t.button;
      });
    </script>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>We're sorry, the page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn">Back to Home</a>
    </div>
  </body>
</html>
